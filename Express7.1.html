<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product List</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    body {
      background-color: #1e1e1e;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .container {
      text-align: center;
      margin-top: 50px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 30px;
    }

    .product-grid {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      margin: 0 20px;
    }

    .product-card {
      background-color: #2a2a2a;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 20px;
      width: 200px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease-in-out;
    }

    .product-card:hover {
      transform: scale(1.05);
    }

    .product-card h2 {
      margin-bottom: 10px;
      font-size: 1.4rem;
    }

    .product-card p {
      margin-bottom: 15px;
    }

    button {
      background-color: #3f51b5;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background-color: #5c6bc0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Product List</h1>
    <div id="productGrid" class="product-grid">
      <p>Loading...</p>
    </div>
  </div>

  <script>
    const grid = document.getElementById("productGrid");
    axios.get("http://localhost:5000/api/products")
      .then((response) => {
        const products = response.data;
        grid.innerHTML = "";

        products.forEach((p) => {
          const card = document.createElement("div");
          card.className = "product-card";
          card.innerHTML = `
            <h2>${p.name}</h2>
            <p>Price: $${p.price}</p>
            <button>Buy Now</button>
          `;
          grid.appendChild(card);
        });
      })
      .catch((error) => {
        grid.innerHTML = `<p style="color:red;">Error fetching data: ${error.message}</p>`;
      });
  </script>
</body>
</html>
